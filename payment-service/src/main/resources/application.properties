# ==========================================
# Application
# ==========================================

spring.application.name=payment-service

# ==========================================
# Server
# ==========================================

server.port=8082

# ==========================================
# MySQL Database
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/ecomkafka
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Kafka
# ==========================================

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092


# ==========================================
# Kafka Consumer
# ==========================================

# Consumer Group
spring.kafka.consumer.group-id=payment-service-group

# Key Deserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Value Deserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust Payment Service event package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecom.paymentservice.kafka.consumer.dto

# Use Payment Service's local Event class
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecom.paymentservice.kafka.consumer.dto.Event

# Ignore Java class information sent by Order Service
spring.kafka.consumer.properties.spring.json.use.type.headers=false


# ==========================================
# Kafka Producer
# ==========================================

# Key Serializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Value Serializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer